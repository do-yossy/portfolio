name: Seed improved jobs (bg/bi 求人ボックス+Indeed)

# 改善版シード（応募が伸びなかった bg / bi の職種名・掲載媒体を見直した版）を
# 本番(sq-saiyou)に投入する。手動実行(workflow_dispatch)。
# 両スクリプトとも冪等（対象の求人だけ削除→作り直し）なので再実行しても安全。
# ローカルに flyctl が無い環境からでも本番実行できるようにするための窓口。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 投入する対象
        type: choice
        default: both
        options:
          - both
          - bg
          - bi

jobs:
  seed:
    name: Seed improved jobs into sq-saiyou
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run improved seed scripts on production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          BG=seed-bg-route-driver-improved-20260812-kyujinbox-indeed
          BI=seed-bi-driver-secretary-improved-20260812-kyujinbox-indeed-engage
          case "$TARGET" in
            bg) SEEDS="$BG" ;;
            bi) SEEDS="$BI" ;;
            *)  SEEDS="$BG $BI" ;;
          esac
          fail=0
          ok=0
          for s in $SEEDS; do
            echo "::group::$s"
            if flyctl ssh console -a sq-saiyou -C "node /app/scripts/$s.js"; then
              echo "OK: $s"
              ok=$((ok+1))
            else
              echo "WARN: $s failed"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done
          echo "----------------------------------------"
          echo "Seed complete. success=$ok fail=$fail"
          if [ "$fail" -gt 0 ]; then
            echo "Some seeds failed." >&2
            exit 1
          fi
