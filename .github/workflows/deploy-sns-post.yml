name: Deploy SNS自動投稿サービス（専用アプリ）

# 専用アプリ（別のサーバー）は Fly.io の利用料がかかるため、自動では動かさない（オーナーの判断：費用をかけない）。
# サービスは、ミチシルベ本体のアプリで SERVICE_HOST のアドレスから出す。専用アプリが必要になったときだけ、手動で実行する。
on:
  workflow_dispatch:

# 続けて push されたときに、作成・デプロイが並んで走らないようにする
concurrency:
  group: deploy-sns-post
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy michishirube-post to Fly.io
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: michishirube-post

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # アプリの有無は、トークンで見えるアプリの一覧で判定する。
      # - 一覧に無い：初回とみなして作成を試みる。作れなければ、警告を出して終える（トークンの権限・名前の重複）
      # - 一覧にある：以降は失敗を見逃さない（状態を確認できなければ、ジョブを失敗にする）
      - name: Ensure app and volume
        id: ensure
        working-directory: ai-bijika-system
        run: |
          if flyctl apps list --json | grep -q "\"Name\": *\"$APP\"\|\"name\": *\"$APP\""; then
            flyctl status -a "$APP" >/dev/null
          else
            if ! flyctl apps create "$APP"; then
              echo "::warning::Fly.io のアプリ $APP を作れませんでした。名前がすでに使われているか、GitHub の FLY_API_TOKEN に、アプリを作る権限（組織のトークン）がありません。お試し手順書の手順0を確認してください。"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$(flyctl volumes list -a "$APP" --json | grep -c '"name": *"sns_post_data"')" = "0" ]; then
            flyctl volumes create sns_post_data -a "$APP" --region nrt --size 1 --yes
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Fly.io
        if: steps.ensure.outputs.ready == 'true'
        working-directory: ai-bijika-system
        run: flyctl deploy --remote-only --config fly.sns.toml -a "$APP"
