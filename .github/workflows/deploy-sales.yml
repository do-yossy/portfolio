name: Deploy Sales Platform

on:
  push:
    branches: [main]
    paths:
      - 'sales-platform/**'
      - '.github/workflows/deploy-sales.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy sales-platform to Fly.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: sales-platform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
