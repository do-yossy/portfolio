name: Deploy AI商品化実践システム

on:
  push:
    branches: [main]
    paths:
      - 'ai-bijika-system/**'
      - '.github/workflows/deploy-ai-bijika.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy ai-bijika-system to Fly.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: ai-bijika-system
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
