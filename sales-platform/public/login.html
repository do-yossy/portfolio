<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | 管制塔</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080c18;color:#dde3f5;font-family:'Noto Sans JP',system-ui,sans-serif}
.box{background:#0f1220;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2rem;width:min(360px,90%)}
h1{font-size:1.1rem;margin-bottom:.3rem}p{font-size:.78rem;color:#8892b0;margin-bottom:1.2rem}
input{width:100%;background:#080c18;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#dde3f5;padding:.7rem;font-size:.9rem;margin-bottom:.8rem}
button{width:100%;background:#5b6ef5;color:#fff;border:none;border-radius:8px;padding:.8rem;font-weight:700;font-size:.9rem;cursor:pointer}
.err{color:#e84545;font-size:.76rem;margin-top:.6rem;min-height:1em}
</style></head>
<body>
<form class="box" onsubmit="return login(event)">
  <h1>管制塔</h1><p>営業バックエンド・管理ログイン</p>
  <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" autofocus>
  <button type="submit">ログイン</button>
  <div class="err" id="err"></div>
</form>
<script>
async function login(e){e.preventDefault();
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
  if(r.ok){location.href='/admin';}else{document.getElementById('err').textContent='パスワードが違います';}
  return false;}
</script>
</body></html>
