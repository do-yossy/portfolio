app = "sq-sales-tanto20"
primary_region = "nrt"

[build]

[env]
  PORT = "3100"
  NODE_OPTIONS = "--experimental-sqlite"
  SALES_GOAL = "1000000"
  PORTFOLIO_BASE = "https://do-yossy.github.io/portfolio/"

[http_service]
  internal_port = 3100
  force_https = true
  # 常時起動（眠らせない）: アクセス時の自動起動が不安定で「Not Found」になるため、
  # マシンを停止させず最低1台を常に稼働させる。
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# データ永続化（SQLite）。本番は fly volume を作成してマウント:
#   fly volumes create sales_data --size 1
[mounts]
  source = "sales_data"
  destination = "/app/data"

# シークレットは fly secrets set ADMIN_PASSWORD=... SLACK_WEBHOOK_URL=... で設定
