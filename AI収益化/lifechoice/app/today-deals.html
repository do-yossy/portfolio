<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日だけ安い｜LIFE CHOICE</title>
<meta name="description" content="当日キャンセル・売り切り在庫など、今日で消える値引きだけを集めます。">
<meta property="og:type" content="website">
<meta property="og:title" content="今日だけ安い｜LIFE CHOICE">
<meta name="theme-color" content="#e11d48">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">
</head>
<body data-service="today-deals">

<main class="lc-wrap lc-main">
  <div id="prefbar"></div>
  <div id="demo-banner"></div>
  <div class="lc-card" id="conds"></div>
  <p class="lc-count" id="stat"></p>
  <div id="list"></div>
  <div id="note"></div>
</main>

<script type="module">
import { mountShell } from '../components/layout.js';
import { PreferenceBar, noticeInherited } from '../components/preference-bar.js';
import { toFilters, fromFilters, snapBudget } from '../lib/preference-sync.js';
import { CrossLinkCard, afterTodayDeals } from '../lib/cross-link.js';
import { Filter } from '../components/filter.js';
import { ResultCard, EmptyState, DemoBanner } from '../components/result.js';
import { Disclaimer } from '../components/footer.js';
import { rankDeals } from '../lib/deal-ranking.js';
import { StaticDataProvider } from '../lib/data-provider.js';
import { yen, hhmm, percent } from '../utils/format.js';
import { pick, pickNumber, html, onChange } from '../utils/dom.js';
import { hasPreference } from '../utils/storage.js';

mountShell('today-deals');
html('#prefbar', PreferenceBar());
const deals = await StaticDataProvider.getDeals();
const f = toFilters('today-deals');

// 厳守事項11：架空データは画面上部で明示し、カード1枚ごとにもDEMO印を出す
html('#demo-banner', DemoBanner(
  '掲載している案件はすべてサンプルです。実在の店舗・価格ではありません。' +
  'この機能は店舗が「今日の余り枠」を投稿しないと成立しないため、実データの供給が最大の課題です。'));

html('#conds',
  Filter({ name: 'budget', label: '予算', value: snapBudget(f.budget, [1000, 3000, 6000, 99999]),
    options: [{ value: 1000, label: '〜1,000円' }, { value: 3000, label: '〜3,000円' },
              { value: 6000, label: '〜6,000円' }, { value: 99999, label: '上限なし' }] }) +
  Filter({ name: 'cat', label: 'カテゴリ', value: 'all',
    options: [{ value: 'all', label: 'すべて' }, { value: '食', label: '食べ物' }, { value: '美容', label: '美容' },
              { value: '遊び', label: '遊び' }, { value: '宿', label: '宿' }] }) +
  (hasPreference() ? noticeInherited('today-deals', { budget: f.budget }) : '')
);

html('#note', Disclaimer({
  hasDemoData: true,
  dataNote: '並び順は「割引率・締切までの近さ・残数・距離」の4要素を合成した総合スコア順です。' +
    '位置情報が未設定のため、距離は現在すべて中立値で計算しています。'
}));

function render() {
  const budget = pickNumber('budget'), category = pick('cat');
  fromFilters('today-deals', { budget });
  const nowHour = new Date().getHours();
  const ranked = rankDeals(deals, { budget, category, nowHour });
  const totalSave = ranked.reduce((s, r) => s + (r.deal.normalPrice - r.deal.salePrice), 0);

  html('#stat', `<b>${ranked.length}件</b>　合計値引き額 <b>${yen(totalSave)}</b>`);

  if (!ranked.length) { html('#list', EmptyState({ title: '条件に合うものがありません', hint: '予算を上げるかカテゴリを広げてください' })); return; }

  html('#list', ranked.map(r => {
    const d = r.deal;
    return ResultCard({
      title: d.title,
      isDemo: d.isDemo,
      price: yen(d.salePrice),
      priceNote: '通常 ' + yen(d.normalPrice),
      tags: [
        { label: percent(d.discountRate) + ' OFF', variant: 'bad' },
        { label: '本日' + hhmm(d.deadlineHour) + 'まで', variant: 'warn' },
        { label: '残り' + d.remainingCount, variant: r.isUrgent ? 'bad' : undefined },
        { label: d.category },
        { label: 'スコア ' + r.score.total }
      ],
      why: d.reason,
      footer: `<p style="margin-top:var(--sp-3);font-size:var(--fs-sm);color:var(--sub);border-top:1px dashed var(--line);padding-top:var(--sp-2)">
        内訳　割引 ${r.score.discount} ／ 締切 ${r.score.urgency} ／ 残数 ${r.score.availability} ／ 距離 ${r.score.distance}</p>`
    });
  }).join('') + CrossLinkCard(afterTodayDeals(ranked.length)));
}

onChange(['budget', 'cat'], render);
render();
</script>
</body>
</html>
