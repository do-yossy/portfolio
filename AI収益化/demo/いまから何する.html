<body>

<header>
  <div class="wrap">
    <span class="demo-tag">DEMO ／ 社内検証用</span>
    <h1>いまから<span>何する？</span></h1>
    <p>時間・予算・気分から、今すぐ行ける場所を横断で探します</p>
  </div>
</header>

<main class="wrap">

  <div class="panel" id="form">
    <div class="row">
      <label class="t">いま何時？ / 何時まで空いてる？</label>
      <div class="timeline">
        <select id="now"></select>
        <span>から</span>
        <select id="until"></select>
        <span>まで</span>
      </div>
    </div>

    <div class="row">
      <label class="t">予算（1人あたり）</label>
      <div class="chips">
        <input type="radio" name="budget" id="b0" value="0"><label for="b0">0円</label>
        <input type="radio" name="budget" id="b1" value="1000"><label for="b1">〜1,000円</label>
        <input type="radio" name="budget" id="b2" value="2000" checked><label for="b2">〜2,000円</label>
        <input type="radio" name="budget" id="b3" value="3000"><label for="b3">〜3,000円</label>
        <input type="radio" name="budget" id="b4" value="5000"><label for="b4">〜5,000円</label>
        <input type="radio" name="budget" id="b5" value="99999"><label for="b5">気にしない</label>
      </div>
    </div>

    <div class="row">
      <label class="t">誰と？</label>
      <div class="chips blue">
        <input type="radio" name="who" id="w1" value="solo" checked><label for="w1">ひとり</label>
        <input type="radio" name="who" id="w2" value="multi"><label for="w2">2人以上</label>
      </div>
    </div>

    <div class="row">
      <label class="t">今日の気分</label>
      <div class="chips blue">
        <input type="radio" name="mood" id="m1" value="quiet" checked><label for="m1">人と話したくない</label>
        <input type="radio" name="mood" id="m2" value="talk"><label for="m2">誰かと話したい</label>
        <input type="radio" name="mood" id="m3" value="any"><label for="m3">どちらでも</label>
      </div>
    </div>

    <div class="row">
      <label class="t">動きたい？</label>
      <div class="chips blue">
        <input type="radio" name="body" id="a1" value="rest" checked><label for="a1">のんびり</label>
        <input type="radio" name="body" id="a2" value="active"><label for="a2">体を動かしたい</label>
        <input type="radio" name="body" id="a3" value="any"><label for="a3">どちらでも</label>
      </div>
    </div>

    <button class="go" id="go">今から行けるところを探す</button>
  </div>

  <div id="out">
    <div class="summary" id="summary"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
    <button class="again" id="again">条件を変えてやり直す</button>
  </div>

  <p class="note">
    <b>データについて。</b><b>47業態</b>を収録。相場・営業時間・所要時間は代表的な業態の一般的な水準で、実在の個別店舗の情報ではありません。<br>本番では地域を1つに絞り、実在施設のデータに差し替えます。<br>
    本番では、予約商材（アソビュー・じゃらん等）と<b>予約不要の選択肢</b>を横断して提示し、予約商材の送客で収益化します。<br>
    既存の予約サイトが「予約できるもの」しか出せないのに対し、<b>予約不要の選択肢も含めて正直に提案する</b>のが本サービスの差別化点です。
  </p>

</main>

      var latestStart=closeAdj-(d.dur/60);
      var fitsTime=(d.dur+30)<=freeMin;
      var fitsOpen=startable>=d.open-0.01 && startable<=latestStart+0.01;
      if(!fitsTime||!fitsOpen) return null;

      // 予算
      if(d.lo>budget) return null;
      if(d.hi<=budget){score+=2;} else {score+=1;reasons.push('予算内に収まるプランを選ぶ必要あり');}

      // ひとり適性
      if(who==='solo'){
        if(d.solo<=2) return null;
        score+=d.solo;
        if(d.solo>=5) reasons.push('一人客が多く浮かない');
      } else { score+=3; }

      // 気分（会話）
      if(mood==='quiet'){ if(d.talk===2) return null; if(d.talk===0) score+=3; }
      else if(mood==='talk'){ if(d.talk===0) score-=2; if(d.talk===2) score+=4; }

      // 体を動かすか
      if(body==='rest'){ if(d.active===2) score-=3; if(d.active===0) score+=2; }
      else if(body==='active'){ if(d.active===0) score-=3; if(d.active===2) score+=4; }

      // 時間がぴったり使えるほど加点
      var ratio=(d.dur+30)/freeMin;
      if(ratio>0.6&&ratio<=1) score+=2;

      return {d:d,score:score,reasons:reasons};
    }).filter(Boolean).sort(function(a,b){return b.score-a.score;});

    var bookCount=res.filter(function(r){return r.d.book;}).length;
    document.getElementById('summary').innerHTML=
      '<b>'+hhmm(now%24)+'</b> から <b>'+Math.floor(freeMin/60)+'時間'+(freeMin%60?freeMin%60+'分':'')+'</b>、'+
      '予算 <b>'+(budget>=99999?'上限なし':yen(budget))+'</b>、'+
      (who==='solo'?'<b>ひとり</b>で':'<b>2人以上</b>で')+
      (mood==='quiet'?'、<b>静かに</b>過ごす':mood==='talk'?'、<b>誰かと話せる</b>ところ':'')+
      '前提で探しました。';
    document.getElementById('count').innerHTML=
      '<b>'+res.length+'件</b>見つかりました（うち予約が要るもの '+bookCount+'件 / <span style="color:var(--ok)">予約不要 '+(res.length-bookCount)+'件</span>）';

    var html=res.slice(0,10).map(function(r){
      var d=r.d;
      var price=d.lo===0&&d.hi===0?'無料':(d.hi>=99999?yen(d.lo)+'〜':yen(d.lo)+'〜'+yen(d.hi));
      var tags='<span class="tag">'+d.cat+'</span>'+
        '<span class="tag">所要 約'+(d.dur>=60?Math.floor(d.dur/60)+'時間'+(d.dur%60?d.dur%60+'分':''):d.dur+'分')+'</span>'+
        (d.book?'<span class="tag book">要予約</span>':'<span class="tag free">予約不要・今すぐ行ける</span>')+
        (d.solo>=5&&who==='solo'?'<span class="tag solo">ひとり歓迎</span>':'')+
        '<span class="tag">〜'+hhmm(d.close>24?d.close-24:d.close)+'</span>';
      var extra=r.reasons.length?'<br>※'+r.reasons.join('／'):'';
      var cta=d.book
        ? '<div class="cta-line">→ <a href="#" onclick="alert(\'本番ではアソビュー・じゃらん等の予約ページへ送客し、ここで成果報酬が発生します\');return false;">当日枠を確認する</a>　<span style="color:var(--sub)">（送客＝収益発生点）</span></div>'
        : '';
      return '<div class="card"><div class="head"><h3>'+d.n+'</h3>'+
        '<div class="price">'+price+'<small>1人あたり</small></div></div>'+
        '<div class="meta">'+tags+'</div>'+
        '<div class="why">'+d.why+extra+'</div>'+cta+'</div>';
    }).join('');

    document.getElementById('list').innerHTML=html||'<div class="empty">条件に合うものが見つかりませんでした。<br>予算を上げるか、時間を長めに取ってみてください。</div>';
    document.getElementById('form').style.display='none';
    document.getElementById('out').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  });

  document.getElementById('again').addEventListener('click',function(){
    document.getElementById('out').style.display='none';
    document.getElementById('form').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>
</body>
</html>
