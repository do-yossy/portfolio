<!-- wp:html -->
<style id="sv-global-hdr">
/* ヘッダー背景のみ半透明ネイビーに統一（/serviceに合わせる）。変数上書きで全レイヤー/全端末に適用。他要素は不変。 */
:root{--color_header_bg:rgba(15,35,80,.75) !important}
.l-header,.l-fixHeader{background:rgba(15,35,80,.75) !important}
.l-header__bar,.l-fixHeader::before,.l-fixHeader:before{background:transparent !important}
/* 戻るボタン(↑)をフォント非依存のCSS描画に統一（アイコンフォント未読込でも必ず同じ「^」マークを表示） */
#pagetop .c-fixBtn__icon::before{content:"" !important}
#pagetop .c-fixBtn__icon{display:flex;align-items:center;justify-content:center}
#pagetop .c-fixBtn__icon::after{content:"";width:10px;height:10px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(-45deg);margin-top:3px}
/* 現在ページのナビ項目に白い下線を常時表示。WPのcurrent-menu-item と JSの.-current 両対応。content/位置も自前指定でmain.css非依存＝プレビューでも確実表示。 */
.c-gnav > .-current > a,.c-gnav > .current-menu-item > a,.c-gnav > .current_page_item > a{position:relative}
.c-gnav > .-current > a::after,.c-gnav > .current-menu-item > a::after,.c-gnav > .current_page_item > a::after{content:"" !important;display:block;position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--color_header_text);transform:scaleX(1) !important;opacity:1}
/* モバイルのスクロール時ヘッダーバーもPCと同じ半透明ネイビーに統一（元は不透明#0f2350で色が濃かった） */
.sp-header-bar{background:rgba(15,35,80,.75) !important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* SERVICEボタン(temple-btn)の矢印の先端を塗り三角(▶)に統一（線＋▶）。他の矢印(仕組み図/RPO/PILLAR)と統一。 */
.temple-btn::before{width:0 !important;height:0 !important;border-top:5px solid transparent !important;border-bottom:5px solid transparent !important;border-left:9px solid #fff !important;background:none !important;top:50% !important;transform:translateY(-50%) !important}
.temple-btn::after{display:none !important} /* 線(シャフト)を消して▶だけに */
/* 上部ヒーロー画像を固定（スクロールしても背景は固定。他ページと統一） */
.page-tops{background-attachment:fixed !important}
/* フッターの住所ブロックを非表示（他ページと統一。共有フッター設定には触れない） */
.footer-main .address{display:none !important}
/* モバイルのドロワーメニュー：英字＋日本語(サブ)の2段表示（トップと統一） */
.p-spMenu a .sv-en{display:block;font-family:"Montserrat",sans-serif;font-weight:600;letter-spacing:.14em;line-height:1.25}
.p-spMenu a .sv-ja{display:block;font-size:.72em;letter-spacing:.06em;opacity:.68;margin-top:.3em}
</style>
<!-- /wp:html -->

<!-- wp:html -->
<script>
/* 現在ページのグローバルナビ項目に白い下線(.-current)を付与。固定ヘッダーの複製にも対応。 */
(function(){
  var TARGET='/contact';
  function mark(){document.querySelectorAll(".c-gnav > li").forEach(function(li){var a=li.querySelector("a");if(a){var h=a.getAttribute("href")||"";if(h.indexOf(TARGET)>-1)li.classList.add("-current");}});}
  mark();setTimeout(mark,300);setTimeout(mark,700);setTimeout(mark,1200);window.addEventListener("load",mark);
})();
</script>
<!-- /wp:html -->

<script id="sv-nav-relabel">
/* このページのみ：PCナビは英字表記、モバイルのドロワーは「英字＋日本語」の2段表示に（トップと統一。公開中のメニュー設定には触れない） */
(function(){
  var PC=[['/service','SERVICE'],['/company','ABOUT'],['/contact','CONTACT']];
  var SP=[['/service','SERVICE','事業内容'],['/company','ABOUT','会社概要'],['/contact','CONTACT','お問い合わせ'],['/policy','PRIVACY POLICY','プライバシーポリシー'],['/privacy','PRIVACY POLICY','プライバシーポリシー']];
  function tail(a,path){var h=(a.getAttribute('href')||'').replace(/[#?].*$/,'').replace(/\/+$/,'');return h.slice(-path.length)===path;}
  function applyPC(){
    document.querySelectorAll('.c-gnav a').forEach(function(a){
      for(var i=0;i<PC.length;i++){ if(tail(a,PC[i][0])){ var t=a.querySelector('.ttl')||a; if(t.textContent.trim()!==PC[i][1]) t.textContent=PC[i][1]; break; } }
    });
  }
  function applySP(){
    document.querySelectorAll('.p-spMenu a').forEach(function(a){
      for(var i=0;i<SP.length;i++){ if(tail(a,SP[i][0])){ if(!a.querySelector('.sv-en')){ a.innerHTML='<span class="sv-en">'+SP[i][1]+'</span><span class="sv-ja">'+SP[i][2]+'</span>'; } break; } }
    });
  }
  function apply(){applyPC();applySP();}
  apply();setTimeout(apply,300);setTimeout(apply,800);setTimeout(apply,1500);window.addEventListener('load',apply);
})();
</script>
<!-- /wp:html -->
