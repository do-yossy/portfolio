<script id="sv-nav-relabel">
/* このページのみ：PCナビは英字表記、モバイルのドロワーは「英字＋日本語」の2段表示に（トップと統一。公開中のメニュー設定には触れない） */
(function(){
  var PC=[['/service','SERVICE'],['/company','ABOUT'],['/contact','CONTACT']];
  var SP=[['/service','SERVICE','事業内容'],['/company','ABOUT','会社概要'],['/contact','CONTACT','お問い合わせ'],['/policy','PRIVACY POLICY','プライバシーポリシー'],['/privacy','PRIVACY POLICY','プライバシーポリシー']];
  function tail(a,path){var h=(a.getAttribute('href')||'').replace(/[#?].*$/,'').replace(/\/+$/,'');return h.slice(-path.length)===path;}
  function applyPC(){
    document.querySelectorAll('.c-gnav a').forEach(function(a){
      for(var i=0;i<PC.length;i++){ if(tail(a,PC[i][0])){ var t=a.querySelector('.ttl')||a; if(t.textContent.trim()!==PC[i][1]) t.textContent=PC[i][1]; break; } }
    });
  }
  function applySP(){
    document.querySelectorAll('.p-spMenu a').forEach(function(a){
      for(var i=0;i<SP.length;i++){ if(tail(a,SP[i][0])){ if(!a.querySelector('.sv-en')){ a.innerHTML='<span class="sv-en">'+SP[i][1]+'</span><span class="sv-ja">'+SP[i][2]+'</span>'; } break; } }
    });
  }
  function apply(){applyPC();applySP();}
  apply();setTimeout(apply,300);setTimeout(apply,800);setTimeout(apply,1500);window.addEventListener('load',apply);
})();
</script>

<style id="sv-inquiry-css">
/* お問い合わせ種別セレクトの見た目（フォームの他項目と統一） */
.wpcf7-form select.sv-inquiry-select{width:100%;max-width:420px;padding:.6em .8em;font-size:1rem;border:1px solid #ccc;border-radius:4px;background:#fff;color:#333}
</style>
<script id="sv-form-inquiry-type">
/* お問い合わせフォームに「お問い合わせ種別」項目を追加（CF7フォーム設定はAPIから更新できないため、
   ページ側で項目を挿入。選択値は送信時にメッセージ本文の先頭へ付記し、通知メールにも反映させる。
   付記はシリアライズ直後に元へ戻すので、画面上の本文入力欄は汚さない） */
(function(){
  var OPTS=['お仕事をお探しの方','人材採用をご検討の企業様','RPO（採用代行）をご検討の企業様','飲食店総合プロデュースのご相談','その他'];
  function build(form){
    if(form.querySelector('[name="your-inquiry-type"]')) return;
    var table=form.querySelector('.CF7_table')||form.querySelector('table'); if(!table) return;
    var sel=document.createElement('select');
    sel.name='your-inquiry-type'; sel.required=true; sel.className='sv-inquiry-select';
    var o0=document.createElement('option'); o0.value=''; o0.textContent='選択してください'; sel.appendChild(o0);
    OPTS.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
    var tr=document.createElement('tr');
    var th=document.createElement('th'); th.innerHTML='<span class="CF7_req">必須</span> お問い合わせ種別';
    var td=document.createElement('td'); td.appendChild(sel);
    tr.appendChild(th); tr.appendChild(td);
    var tbody=table.tBodies[0]||table;
    tbody.insertBefore(tr, tbody.firstChild);
    // 送信時：未選択なら送信を止めて選択を促す（CF7がnovalidateでも必須を担保）。
    // 選択済みなら選択値をメッセージ本文の先頭へ付記→シリアライズ直後に元へ戻す。
    form.addEventListener('submit', function(e){
      var s=form.querySelector('[name="your-inquiry-type"]');
      var msg=form.querySelector('[name="your-message"]');
      if(s && !s.value){
        e.preventDefault(); e.stopImmediatePropagation();
        if(s.reportValidity){s.reportValidity();} else {s.focus();}
        return;
      }
      if(s && s.value && msg){
        var orig=msg.value;
        msg.value='【お問い合わせ種別】'+s.value+'\n\n'+orig;
        setTimeout(function(){msg.value=orig;},0);
      }
    }, true);
  }
  function init(){document.querySelectorAll('form.wpcf7-form').forEach(build);}
  init();setTimeout(init,500);setTimeout(init,1200);window.addEventListener('load',init);
})();
</script>
<!-- /wp:html -->

<script id="sv-mobfix">
/* モバイル(タッチ端末)のみ：上部ヒーロー画像を固定に見せる代替方式。画像レイヤー(.sv-mfx)を挿入し追従させて固定を再現。 */
(function(){
  try{ if(!window.matchMedia || !matchMedia('(hover:none) and (pointer:coarse)').matches) return; }catch(e){ return; }
  function setup(){
    var hero=document.querySelector('.page-tops'); if(!hero || hero.querySelector('.sv-mfx')) return;
    var layer=document.createElement('div'); layer.className='sv-mfx'; layer.setAttribute('aria-hidden','true');
    hero.insertBefore(layer, hero.firstChild);
    var ticking=false;
    function upd(){var r=hero.getBoundingClientRect();layer.style.transform='translate3d(0,'+(-r.top).toFixed(1)+'px,0)';ticking=false;}
    function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(upd);}}
    upd();
    window.addEventListener('scroll',onScroll,{passive:true});
    window.addEventListener('resize',function(){requestAnimationFrame(upd);});
    window.addEventListener('orientationchange',function(){requestAnimationFrame(upd);});
  }
  if(document.readyState!=='loading')setup();else document.addEventListener('DOMContentLoaded',setup);
})();
</script>
<!-- /wp:html -->
