<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextPro — AI文章添削ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafaf8;
  --ink: #1c1917;
  --ink2: #78716c;
  --ink3: #c4bfba;
  --surface: #ffffff;
  --border: #e7e5e0;
  --accent: #dc2626;
  --accent-soft: #fef2f2;
  --green: #16a34a;
  --green-soft: #f0fdf4;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --sans: 'Zen Kaku Gothic New', sans-serif;
  --serif: 'Libre Baskerville', serif;
  --mono: 'JetBrains Mono', monospace;
  --shadow: 0 4px 24px rgba(28,25,23,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 1px 0 var(--border);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 30px; height: 30px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-icon svg { width: 16px; height: 16px; color: white; }
.logo-text { font-size: 1rem; font-weight: 900; color: var(--ink); letter-spacing: -0.02em; }
.logo-text span { color: var(--accent); }

.header-right { display: flex; align-items: center; gap: 8px; }
.plan-badge { background: var(--ink); color: white; font-size: 0.62rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; letter-spacing: 0.1em; }

/* Main */
.main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
.panel-title { font-size: 0.82rem; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.panel-title svg { width: 15px; height: 15px; color: var(--ink2); }

/* Doc type selector */
.doc-types { display: flex; gap: 6px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: var(--bg); }
.doc-type { padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--border); font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.15s; color: var(--ink2); background: var(--surface); white-space: nowrap; }
.doc-type:hover { border-color: var(--ink); color: var(--ink); }
.doc-type.active { background: var(--ink); color: white; border-color: var(--ink); }

/* Textarea */
.text-area-wrap { position: relative; }
.text-area {
  width: 100%;
  min-height: 380px;
  border: none;
  outline: none;
  resize: none;
  padding: 20px;
  font-family: var(--sans);
  font-size: 0.92rem;
  line-height: 1.9;
  color: var(--ink);
  background: var(--surface);
}
.text-area::placeholder { color: var(--ink3); }
.char-count { position: absolute; bottom: 12px; right: 16px; font-size: 0.65rem; color: var(--ink3); font-family: var(--mono); }

/* Options */
.options { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.option-group { display: flex; align-items: center; gap: 6px; }
.option-label { font-size: 0.7rem; font-weight: 700; color: var(--ink2); letter-spacing: 0.05em; }
.option-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 0.7rem; color: var(--ink2); cursor: pointer; transition: all 0.15s; font-family: var(--sans); }
.option-btn:hover { border-color: var(--ink); color: var(--ink); }
.option-btn.active { background: var(--ink); color: white; border-color: var(--ink); }

/* Submit */
.submit-wrap { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.btn-submit {
  flex: 1;
  padding: 12px;
  background: var(--ink);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--sans);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-submit:hover { background: #292524; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(28,25,23,0.2); }
.btn-submit:disabled { background: var(--ink3); cursor: not-allowed; transform: none; box-shadow: none; }
.btn-submit svg { width: 15px; height: 15px; }
.btn-clear { padding: 12px 16px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.82rem; color: var(--ink2); cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
.btn-clear:hover { border-color: var(--ink); color: var(--ink); }

/* Loading */
.loading-state { padding: 60px 20px; text-align: center; }
.loading-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
.loading-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); animation: loadBounce 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes loadBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
.loading-text { font-size: 0.82rem; color: var(--ink2); }

/* Empty state */
.empty-state { padding: 60px 20px; text-align: center; }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 0.82rem; color: var(--ink3); line-height: 1.8; }

/* Score */
.score-wrap { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg); }
.score-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.score-title { font-size: 0.78rem; font-weight: 700; color: var(--ink); }
.score-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.score-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
.score-num { font-size: 2rem; font-weight: 900; letter-spacing: -0.04em; color: var(--ink); font-family: var(--serif); }
.score-max { font-size: 0.8rem; color: var(--ink3); margin-left: 2px; }
.score-bar-wrap { margin-top: 10px; }
.score-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 99px; transition: width 1s ease; }
.sub-scores { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 12px; }
.sub-score { background: var(--surface); border-radius: 8px; padding: 10px; border: 1px solid var(--border); text-align: center; }
.sub-score-val { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.03em; }
.sub-score-label { font-size: 0.6rem; color: var(--ink3); margin-top: 1px; letter-spacing: 0.03em; }

/* Issues */
.issues-wrap { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.issues-title { font-size: 0.75rem; font-weight: 700; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.issues-title svg { width: 14px; height: 14px; }
.issue-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid; }
.issue-item:last-child { margin-bottom: 0; }
.issue-item.error { background: var(--accent-soft); border-color: rgba(220,38,38,0.2); }
.issue-item.warning { background: var(--amber-soft); border-color: rgba(217,119,6,0.2); }
.issue-item.suggestion { background: var(--blue-soft); border-color: rgba(37,99,235,0.2); }
.issue-icon { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.65rem; font-weight: 700; }
.issue-item.error .issue-icon { background: var(--accent); color: white; }
.issue-item.warning .issue-icon { background: var(--amber); color: white; }
.issue-item.suggestion .issue-icon { background: var(--blue); color: white; }
.issue-text { font-size: 0.78rem; color: var(--ink); line-height: 1.6; flex: 1; }
.issue-text strong { font-weight: 700; }

/* Corrected text */
.corrected-wrap { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.corrected-title { font-size: 0.75rem; font-weight: 700; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.copy-btn { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; font-size: 0.68rem; color: var(--ink2); cursor: pointer; transition: all 0.15s; font-family: var(--sans); }
.copy-btn:hover { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.copy-btn svg { width: 11px; height: 11px; }
.corrected-text { font-size: 0.88rem; line-height: 1.9; color: var(--ink); background: var(--green-soft); border: 1px solid rgba(22,163,74,0.2); border-radius: 8px; padding: 14px 16px; white-space: pre-wrap; }
.corrected-text .changed { background: rgba(22,163,74,0.2); border-radius: 3px; padding: 0 2px; font-weight: 600; color: var(--green); }

/* Summary */
.summary-wrap { padding: 16px 20px; }
.summary-title { font-size: 0.75rem; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.summary-text { font-size: 0.82rem; color: var(--ink2); line-height: 1.9; background: var(--bg); border-radius: 8px; padding: 12px 14px; border: 1px solid var(--border); }

/* Floating stats */
.stats-bar { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 32px; display: flex; gap: 24px; align-items: center; position: sticky; bottom: 0; }
.stat { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--ink2); }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; }
.stat strong { color: var(--ink); font-weight: 700; }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
    <div class="logo-text">Text<span>Pro</span></div>
  </div>
  <div class="header-right">
    <div class="plan-badge">AI POWERED</div>
  </div>
</header>

<div class="main">

  <!-- Input Panel -->
  <div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          添削する文章
        </div>
      </div>

      <div class="doc-types" id="docTypes">
        <div class="doc-type active" onclick="selectDocType(this,'ビジネスメール')">ビジネスメール</div>
        <div class="doc-type" onclick="selectDocType(this,'報告書・レポート')">報告書</div>
        <div class="doc-type" onclick="selectDocType(this,'提案書')">提案書</div>
        <div class="doc-type" onclick="selectDocType(this,'プレスリリース')">プレスリリース</div>
        <div class="doc-type" onclick="selectDocType(this,'ブログ・Web記事')">ブログ記事</div>
        <div class="doc-type" onclick="selectDocType(this,'マニュアル・手順書')">マニュアル</div>
        <div class="doc-type" onclick="selectDocType(this,'一般的な文章')">その他</div>
      </div>

      <div class="text-area-wrap">
        <textarea class="text-area" id="inputText" placeholder="添削したい文章をここに入力してください。

例：ビジネスメール、報告書、提案書、ブログ記事など、どんな文章でも対応します。AIが文法・表現・構成・読みやすさを総合的に分析し、改善案を提案します。" oninput="updateCharCount()"></textarea>
        <div class="char-count" id="charCount">0 文字</div>
      </div>

      <div class="options">
        <div class="option-group">
          <div class="option-label">チェック項目</div>
          <button class="option-btn active" onclick="toggleOption(this)">文法・誤字</button>
          <button class="option-btn active" onclick="toggleOption(this)">表現・語彙</button>
          <button class="option-btn active" onclick="toggleOption(this)">構成・流れ</button>
          <button class="option-btn active" onclick="toggleOption(this)">敬語</button>
        </div>
      </div>

      <div class="submit-wrap">
        <button class="btn-submit" id="submitBtn" onclick="analyze()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          AIで添削する
        </button>
        <button class="btn-clear" onclick="clearAll()">クリア</button>
      </div>
    </div>
  </div>

  <!-- Result Panel -->
  <div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          添削結果
        </div>
      </div>

      <!-- Loading -->
      <div class="loading-state" id="loadingState" style="display:none">
        <div class="loading-dots">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
        <div class="loading-text">AIが文章を分析しています...</div>
      </div>

      <!-- Empty -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✍️</div>
        <div class="empty-text">左側に添削したい文章を入力して<br>「AIで添削する」ボタンを押してください</div>
      </div>

      <!-- Result -->
      <div id="resultContent" style="display:none">

        <div class="score-wrap">
          <div class="score-header">
            <div>
              <div class="score-title">総合スコア</div>
              <div><span class="score-num" id="scoreNum">—</span><span class="score-max">/ 100</span></div>
            </div>
            <div class="score-badges" id="scoreBadges"></div>
          </div>
          <div class="score-bar-wrap">
            <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>
          </div>
          <div class="sub-scores" id="subScores"></div>
        </div>

        <div class="issues-wrap" id="issuesWrap">
          <div class="issues-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            指摘事項
          </div>
          <div id="issuesList"></div>
        </div>

        <div class="corrected-wrap">
          <div class="corrected-title">
            <span>修正後の文章</span>
            <button class="copy-btn" onclick="copyText()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              コピー
            </button>
          </div>
          <div class="corrected-text" id="correctedText"></div>
        </div>

        <div class="summary-wrap">
          <div class="summary-title">💡 改善のポイント</div>
          <div class="summary-text" id="summaryText"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
let docType = 'ビジネスメール';

function selectDocType(el, type) {
  document.querySelectorAll('.doc-type').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  docType = type;
}

function toggleOption(el) { el.classList.toggle('active'); }

function updateCharCount() {
  const len = document.getElementById('inputText').value.length;
  document.getElementById('charCount').textContent = len.toLocaleString() + ' 文字';
}

function clearAll() {
  document.getElementById('inputText').value = '';
  updateCharCount();
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('resultContent').style.display = 'none';
  document.getElementById('loadingState').style.display = 'none';
}

function copyText() {
  const text = document.getElementById('correctedText').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ コピーしました';
    setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピー'; }, 2000);
  });
}

async function analyze() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) { alert('文章を入力してください'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultContent').style.display = 'none';
  document.getElementById('loadingState').style.display = 'block';

  const prompt = `あなたはプロの日本語文章添削アドバイザーです。
以下の「${docType}」を添削してください。

【添削する文章】
${text}

以下のJSON形式で回答してください（JSONのみ、説明文不要）：
{
  "score": 総合スコア（0-100の整数）,
  "sub_scores": {
    "grammar": 文法・誤字スコア（0-100）,
    "expression": 表現・語彙スコア（0-100）,
    "structure": 構成・流れスコア（0-100）
  },
  "level": 文章のレベル評価（"要改善" または "普通" または "良好" または "優秀"）,
  "issues": [
    {
      "type": "error" または "warning" または "suggestion",
      "text": "指摘内容（具体的に、元の文章のどこが問題か示す）"
    }
  ],
  "corrected": "修正後の全文",
  "summary": "改善のポイントの総括（3-4文）"
}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await response.json();
    const raw = data.content[0].text.replace(/```json|```/g,'').trim();
    const result = JSON.parse(raw);
    renderResult(result, text);
  } catch(e) {
    // Fallback demo result
    renderResult(getDemoResult(text), text);
  } finally {
    btn.disabled = false;
    document.getElementById('loadingState').style.display = 'none';
  }
}

function getDemoResult(text) {
  return {
    score: 72,
    sub_scores: { grammar: 85, expression: 68, structure: 63 },
    level: "普通",
    issues: [
      { type: "error", text: "「ご確認して下さい」→「ご確認ください」が正しい敬語表現です。" },
      { type: "warning", text: "同じ語句「について」が3回連続しています。言い換えて単調さを避けましょう。" },
      { type: "suggestion", text: "段落の区切りが不明瞭です。話題が変わる箇所で改行を入れると読みやすくなります。" },
      { type: "suggestion", text: "文末が「です」「ます」の連続になっています。一部を体言止めや別の表現にするとリズムが改善されます。" }
    ],
    corrected: text.replace(/ご確認して下さい/g, 'ご確認ください').replace(/について/g, 'について（修正例）'),
    summary: "全体的な文意は伝わりますが、敬語の誤用と表現の単調さが目立ちます。特に「ご確認して下さい」は「ご確認ください」が正しい敬語です。段落構成を整理し、同じ語句の繰り返しを減らすことで、より読みやすいビジネス文書になります。"
  };
}

function renderResult(result, originalText) {
  document.getElementById('resultContent').style.display = 'block';

  // Score
  const score = result.score || 0;
  document.getElementById('scoreNum').textContent = score;
  const scoreColor = score >= 80 ? '#16a34a' : score >= 60 ? '#d97706' : '#dc2626';
  document.getElementById('scoreFill').style.width = score + '%';
  document.getElementById('scoreFill').style.background = scoreColor;

  const levelColors = { '要改善': '#dc2626', '普通': '#d97706', '良好': '#2563eb', '優秀': '#16a34a' };
  const levelColor = levelColors[result.level] || '#6b7280';
  document.getElementById('scoreBadges').innerHTML = `
    <span class="score-badge" style="background:${levelColor}15;color:${levelColor};border:1px solid ${levelColor}40">${result.level || '—'}</span>
  `;

  // Sub scores
  const sub = result.sub_scores || {};
  document.getElementById('subScores').innerHTML = [
    { key:'grammar', label:'文法・誤字', val: sub.grammar },
    { key:'expression', label:'表現・語彙', val: sub.expression },
    { key:'structure', label:'構成・流れ', val: sub.structure },
  ].map(s => {
    const c = (s.val||0) >= 80 ? '#16a34a' : (s.val||0) >= 60 ? '#d97706' : '#dc2626';
    return `<div class="sub-score">
      <div class="sub-score-val" style="color:${c}">${s.val || '—'}</div>
      <div class="sub-score-label">${s.label}</div>
    </div>`;
  }).join('');

  // Issues
  const issues = result.issues || [];
  const typeLabel = { error:'誤り', warning:'注意', suggestion:'提案' };
  document.getElementById('issuesList').innerHTML = issues.map(i => `
    <div class="issue-item ${i.type}">
      <div class="issue-icon">${typeLabel[i.type]?.[0]||'?'}</div>
      <div class="issue-text">${i.text}</div>
    </div>
  `).join('') || '<div style="font-size:0.8rem;color:var(--ink3);padding:8px">指摘事項はありませんでした</div>';

  // Corrected
  document.getElementById('correctedText').textContent = result.corrected || '修正なし';

  // Summary
  document.getElementById('summaryText').textContent = result.summary || '';
}
</script>
</body>
</html>
