<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>応募コックピット — 1画面で1日分の応募を流す</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
  --accent:#4f8ef7;--accent2:#7c5cbf;--gold:#f0b429;--green:#2dd4a0;--red:#f87171;
  --text:#e8eaf0;--text2:#9ca3b8;--border:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-weight:300;line-height:1.7;font-size:14px;padding:1.5rem 1rem 4rem}
.wrap{max-width:960px;margin:0 auto}
.page-header{text-align:center;padding:1.5rem 0;border-bottom:1px solid var(--border);margin-bottom:1.2rem}
.page-header h1{font-size:1.4rem;font-weight:700;letter-spacing:.06em}
.page-header p{color:var(--text2);font-size:.78rem;letter-spacing:.1em;margin-top:.3rem}
.kpibar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.kpi{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem;text-align:center}
.kpi .v{font-size:1.3rem;font-weight:700}
.kpi .l{font-size:.65rem;color:var(--text2);margin-top:.2rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.intake textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:ui-monospace,monospace;font-size:.78rem;padding:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;text-decoration:none}
.btn:hover{background:#3d7be0;transform:translateY(-1px)}
.btn-sm{padding:.4rem .7rem;font-size:.74rem}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2);background:transparent}
.btn-green{background:var(--green);color:#06281d}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn-gold{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.app{border-left:3px solid var(--border)}
.app.done{opacity:.55;border-left-color:var(--green)}
.app-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.app-title{font-size:1rem;font-weight:700;color:var(--text)}
.app-meta{font-size:.72rem;color:var(--text2);margin-top:.3rem}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700;margin-left:.4rem}
.b-s{background:rgba(45,212,160,.15);color:var(--green)}
.b-a{background:rgba(79,142,247,.15);color:var(--accent)}
.b-b{background:rgba(240,180,41,.15);color:var(--gold)}
.b-x{background:rgba(248,113,113,.15);color:var(--red)}
.score{font-size:1.6rem;font-weight:700}
.proposal{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.82rem;line-height:1.8;padding:.7rem;margin:.7rem 0;resize:vertical}
.status-tag{font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:6px}
.st-applied{background:rgba(79,142,247,.15);color:var(--accent)}
.st-won{background:rgba(45,212,160,.15);color:var(--green)}
.st-lost{background:rgba(248,113,113,.15);color:var(--red)}
.st-no_reply{background:rgba(240,180,41,.12);color:var(--gold)}
.result-inputs{display:none;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.result-inputs.show{display:flex}
.result-inputs input{width:110px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.76rem;padding:.4rem}
.hint{font-size:.74rem;color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:2rem;font-size:.85rem}
details summary{cursor:pointer;color:var(--text2);font-size:.8rem}
@media(max-width:640px){.kpi{min-width:45%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <h1>応募コックピット</h1>
    <p>思考はAIが担当。あなたの操作は「コピー → 案件ページ → 貼って提出」の約15秒だけ。</p>
  </div>

  <div class="kpibar">
    <div class="kpi"><div class="v" id="k_total">0</div><div class="l">キュー件数</div></div>
    <div class="kpi"><div class="v" id="k_applied">0</div><div class="l">応募済み</div></div>
    <div class="kpi"><div class="v" id="k_won">0</div><div class="l">受注</div></div>
    <div class="kpi"><div class="v" id="k_rate">—</div><div class="l">受注率</div></div>
  </div>

  <div class="card intake">
    <div class="row" style="justify-content:space-between">
      <strong style="font-size:.85rem;color:var(--gold)">応募キューの読み込み</strong>
      <div class="row">
        <button class="btn btn-sm btn-ghost" onclick="tryFetch()">公開キューを取得</button>
        <label class="hint"><input type="checkbox" id="showExample" onchange="render()"> 見本も表示</label>
      </div>
    </div>
    <p class="hint" style="margin:.5rem 0">AIが生成した応募キュー（JSON配列）を貼って「読み込む」。または公開リポジトリの <code>営業システム/応募キュー.json</code> を取得。</p>
    <textarea id="intake" placeholder='[ {"id":"...","title":"...","proposal":"...", ...} ]'></textarea>
    <div class="row" style="margin-top:.6rem">
      <button class="btn" onclick="loadFromText()">読み込む</button>
      <button class="btn btn-ghost btn-sm" onclick="exportLog()">学習ログを出力（応募ログ.jsonl）</button>
      <button class="btn btn-ghost btn-sm" onclick="resetStatus()">記録をリセット</button>
    </div>
  </div>

  <div id="list"></div>

  <div class="card" id="exportCard" style="display:none">
    <strong style="font-size:.85rem;color:var(--gold)">応募ログ.jsonl に貼り戻す</strong>
    <p class="hint" style="margin:.4rem 0">以下を <code>営業システム/学習/応募ログ.jsonl</code> に追記 → <code>node 集計.js</code> で学習が回ります。</p>
    <textarea id="exportOut" class="proposal" readonly style="font-family:ui-monospace,monospace;font-size:.74rem"></textarea>
    <button class="btn btn-sm" onclick="copyExport()">コピー</button>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const yen = n => '¥' + Math.round(n||0).toLocaleString('ja-JP');
const SKEY = 'cockpit_status_v1', QKEY = 'cockpit_queue_v1';

let queue = [];
let status = {};
try { status = JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch { status = {}; }
try { queue = JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch { queue = []; }
const proposals = {}; // id -> raw proposal text (for clipboard)

function saveStatus(){ localStorage.setItem(SKEY, JSON.stringify(status)); }
function saveQueue(){ localStorage.setItem(QKEY, JSON.stringify(queue)); }

function loadFromText(){
  const t = $('intake').value.trim();
  if(!t){ alert('JSONを貼ってください'); return; }
  let data;
  try { data = JSON.parse(t); } catch(e){ alert('JSONの形式が不正です: ' + e.message); return; }
  if(!Array.isArray(data)) data = [data];
  mergeQueue(data);
  $('intake').value = '';
  render();
}

function mergeQueue(data){
  const byId = new Map(queue.map(q => [q.id, q]));
  for(const item of data){ if(item && item.id) byId.set(item.id, item); }
  queue = [...byId.values()];
  saveQueue();
}

function tryFetch(){
  fetch('営業システム/応募キュー.json', {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => { mergeQueue(Array.isArray(data)?data:[data]); render(); })
    .catch(e => alert('取得できませんでした（ローカルfile://では不可・公開URLで開いてください）: ' + e.message));
}

function badgeClass(p){ return p==='S'?'b-s':p==='A'?'b-a':p==='B'?'b-b':'b-x'; }

function copyText(id){
  const txt = proposals[id] || '';
  navigator.clipboard?.writeText(txt).then(()=>flash(id,'コピーしました ✓'))
    .catch(()=>{ fallbackCopy(txt); flash(id,'コピーしました ✓'); });
}
function fallbackCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
function flash(id,msg){ const b=$('copy_'+id); if(!b)return; const o=b.textContent; b.textContent=msg; setTimeout(()=>b.textContent=o,1400); }

function setOutcome(id, outcome){
  status[id] = status[id] || {};
  status[id].outcome = outcome;
  if(outcome==='applied' && !status[id].applied_at) status[id].applied_at = new Date().toISOString().slice(0,10);
  saveStatus(); render();
}
function setField(id, field, val){ status[id]=status[id]||{}; status[id][field]= val===''?undefined:Number(val); saveStatus(); updateKPIs(); }

function updateKPIs(){
  const vis = visibleQueue();
  const applied = vis.filter(q => status[q.id] && ['applied','won','lost','no_reply'].includes(status[q.id].outcome));
  const decided = vis.filter(q => status[q.id] && ['won','lost','no_reply'].includes(status[q.id].outcome));
  const won = vis.filter(q => status[q.id] && status[q.id].outcome==='won');
  $('k_total').textContent = vis.length;
  $('k_applied').textContent = applied.length;
  $('k_won').textContent = won.length;
  $('k_rate').textContent = decided.length ? Math.round(won.length/decided.length*100)+'%' : '—';
}

function visibleQueue(){
  const showEx = $('showExample').checked;
  return queue.filter(q => showEx || !q.example)
    .slice().sort((a,b)=>(b.score||0)-(a.score||0));
}

function render(){
  const list = $('list');
  const vis = visibleQueue();
  list.innerHTML = '';
  if(!vis.length){ list.innerHTML = '<div class="card empty">キューが空です。AIが生成した応募キュー(JSON)を上に貼って「読み込む」を押してください。</div>'; updateKPIs(); return; }

  for(const q of vis){
    proposals[q.id] = q.proposal || '';
    const st = status[q.id] || {};
    const done = ['applied','won','lost','no_reply'].includes(st.outcome);
    const card = document.createElement('div');
    card.className = 'card app' + (done?' done':'');
    const stTag = st.outcome ? `<span class="status-tag st-${st.outcome}">${({applied:'応募済み',won:'受注',lost:'失注',no_reply:'返信なし'})[st.outcome]||st.outcome}</span>` : '';
    card.innerHTML = `
      <div class="app-head">
        <div>
          <div class="app-title">${esc(q.title||'(無題)')} <span class="badge ${badgeClass(q.priority)}">${esc(q.priority||'?')}</span> ${stTag}</div>
          <div class="app-meta">${esc(q.channel||'')} ・ ${esc(q.type||'')} ・ 予算${yen(q.budget)} ・ 提示${yen(q.proposed_price)} ・ 想定${esc(q.est_hours)}h ・ 予測受注率${esc(q.pred_win_rate)}% ・ テンプレ${esc(q.template||'-')}</div>
        </div>
        <div class="score ${badgeClass(q.priority).replace('b-','').replace('s','')}" style="color:var(--gold)">${esc(q.score)}</div>
      </div>
      <textarea class="proposal" readonly>${esc(q.proposal)}</textarea>
      <div class="row">
        <button class="btn btn-sm" id="copy_${q.id}" onclick="copyText('${q.id}')">📋 提案文をコピー</button>
        ${q.url?`<a class="btn btn-sm btn-ghost" href="${esc(q.url)}" target="_blank" rel="noopener">🔗 案件ページを開く</a>`:''}
        ${q.demo_url?`<a class="btn btn-sm btn-ghost" href="${esc(q.demo_url)}" target="_blank" rel="noopener">🖼 デモを開く</a>`:''}
      </div>
      <div class="row" style="margin-top:.7rem">
        <span class="hint">結果：</span>
        <button class="btn btn-sm btn-ghost" onclick="setOutcome('${q.id}','applied')">応募済み</button>
        <button class="btn btn-sm btn-green" onclick="setOutcome('${q.id}','won')">受注</button>
        <button class="btn btn-sm btn-red" onclick="setOutcome('${q.id}','lost')">失注</button>
        <button class="btn btn-sm btn-gold" onclick="setOutcome('${q.id}','no_reply')">返信なし</button>
      </div>
      <div class="result-inputs ${st.outcome==='won'?'show':''}" id="ri_${q.id}">
        <input type="number" placeholder="受注額" value="${st.actual_price??''}" onchange="setField('${q.id}','actual_price',this.value)">
        <input type="number" placeholder="実工数h" value="${st.actual_hours??''}" onchange="setField('${q.id}','actual_hours',this.value)">
        <input type="number" placeholder="利益率%" value="${st.profit_rate??''}" onchange="setField('${q.id}','profit_rate',this.value)">
        <input type="number" placeholder="保守/月" value="${st.maintenance??''}" onchange="setField('${q.id}','maintenance',this.value)">
      </div>`;
    list.appendChild(card);
  }
  updateKPIs();
}

function exportLog(){
  const worked = queue.filter(q => status[q.id] && status[q.id].outcome);
  if(!worked.length){ alert('結果を記録した案件がありません'); return; }
  const lines = worked.map(q => {
    const st = status[q.id];
    const rec = {
      id:q.id, date:q.date||st.applied_at||new Date().toISOString().slice(0,10),
      channel:q.channel, title:q.title, industry:q.industry, type:q.type,
      budget:q.budget, proposed_price:q.proposed_price, est_hours:q.est_hours,
      score:q.score, priority:q.priority, pred_win_rate:q.pred_win_rate, template:q.template,
      outcome:st.outcome,
      actual_price:st.actual_price||0, actual_hours:st.actual_hours||0,
      profit_rate:st.profit_rate||0, maintenance:st.maintenance||0,
      win_factors:'', loss_factors:'', notes:q.notes||''
    };
    return JSON.stringify(rec);
  });
  $('exportOut').value = lines.join('\n');
  $('exportCard').style.display = 'block';
  $('exportCard').scrollIntoView({behavior:'smooth'});
}
function copyExport(){ const t=$('exportOut'); t.select(); document.execCommand('copy'); }
function resetStatus(){ if(confirm('応募済み/結果の記録を全消去しますか？（キュー自体は残ります）')){ status={}; saveStatus(); render(); } }

render();
</script>
</body>
</html>
